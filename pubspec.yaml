name: indoor_nav
description: MVP indoor navigation app using BLE beacon RSSI zone-snapping and Dijkstra pathfinding.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_svg: ^2.0.10
  permission_handler: ^11.3.1
  sensors_plus: ^7.1.0
  path_provider: ^2.1.6
  xml: ^6.5.0
  wifi_scan: ^0.4.1+2
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
  indoor_nav_engine:
    path: packages/indoor_nav_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/store_data.json
    - assets/navigation_config.json
    - assets/floorMap.svg
