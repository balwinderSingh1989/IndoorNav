<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1750" height="850" viewBox="0 0 1750 850" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Modern Office Indoor Navigation Floor Map</title>
  <desc>Cropped, mobile-optimized vector office floor plan for beacon-based indoor navigation in Flutter.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.10"/>
    </filter>
    <pattern id="floorPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E8EDF2" stroke-width="1"/>
    </pattern>
    <style>
      .wall { fill:#FFFFFF; stroke:#27313B; stroke-width:8; stroke-linejoin:round; }
      .wall-open { fill:#FFFFFF; stroke:#27313B; stroke-width:8; stroke-linejoin:round; }
      .room { stroke:#D8DEE5; stroke-width:2; }
      .label { font-family:Inter,Arial,sans-serif; fill:#27313B; font-weight:700; letter-spacing:.3px; }
      .small { font-family:Inter,Arial,sans-serif; fill:#64717E; font-weight:600; letter-spacing:.2px; }
      .furniture { fill:#DCE3E9; stroke:#AEB8C2; stroke-width:2; }
      .desk { fill:#E9EDF1; stroke:#AEB8C2; stroke-width:2; }
      .chair { fill:#B9C3CC; stroke:#8D99A5; stroke-width:2; }
      .beacon-ring { fill:#E8F3FF; stroke:#2F80ED; stroke-width:2; opacity:.95; }
      .beacon-dot { fill:#2F80ED; }
      .pill { fill:#E8F0FA; stroke:#D2DFEF; stroke-width:1; }
      .pill-text { font-family:Inter,Arial,sans-serif; fill:#173A63; font-weight:800; letter-spacing:.2px; }
      .route { fill:none; stroke:#2F80ED; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:20 15; opacity:.95; }
    </style>
  </defs>

  <!-- Base (cropped to content bounding box: x 45-1705, y 31-811, plus margin) -->
  <rect x="0" y="0" width="1750" height="850" rx="18" fill="#F5F7F9"/>
  <rect x="22" y="22" width="1706" height="806" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="22" y="22" width="1706" height="806" rx="22" fill="url(#floorPattern)" opacity=".55"/>

  <!-- ===== ROOM ZONES ===== -->

  <!-- Breakout -->
  <g id="room-breakout" data-room="breakout">
    <rect class="room" x="45" y="31" width="405" height="202" rx="14" fill="#FFF5E8"/>
    <rect class="pill" x="258" y="47" width="145" height="34" rx="17"/>
    <text x="330" y="70" text-anchor="middle" class="pill-text" font-size="17">Breakout Area</text>
    <rect class="desk" x="155" y="91" width="175" height="68" rx="10" transform="rotate(-38 242 125)"/>
    <circle class="chair" cx="143" cy="89" r="27"/>
    <circle class="chair" cx="320" cy="166" r="27"/>
    <circle cx="366" cy="105" r="24" fill="#FFFFFF" stroke="#AEB8C2" stroke-width="3"/>
    <circle cx="366" cy="105" r="9" fill="#AEB8C2"/>
    <text x="354" y="192" class="small" font-size="14">Collaboration</text>
  </g>

  <!-- Top sitting area -->
  <g id="room-sitting-2" data-room="sitting-area-2">
    <rect class="room" x="527" y="31" width="1178" height="202" rx="14" fill="#EAF6F2"/>
    <rect class="pill" x="1090" y="47" width="160" height="34" rx="17"/>
    <text x="1170" y="70" text-anchor="middle" class="pill-text" font-size="16">Sitting Area 2</text>

    <g transform="translate(552 58)">
      <rect class="desk" width="198" height="82" rx="8"/>
      <rect class="furniture" x="145" y="82" width="53" height="92" rx="6"/>
      <ellipse class="chair" cx="98" cy="142" rx="30" ry="36"/>
    </g>
    <g transform="translate(846 58)">
      <rect class="desk" width="198" height="82" rx="8"/>
      <rect class="furniture" x="145" y="82" width="53" height="92" rx="6"/>
      <ellipse class="chair" cx="98" cy="142" rx="30" ry="36"/>
    </g>
    <g transform="translate(1120 58)">
      <rect class="desk" width="198" height="82" rx="8"/>
      <rect class="furniture" x="145" y="82" width="53" height="92" rx="6"/>
      <ellipse class="chair" cx="98" cy="142" rx="30" ry="36"/>
    </g>
    <g transform="translate(1407 58)">
      <rect class="desk" width="198" height="82" rx="8"/>
      <rect class="furniture" x="145" y="82" width="53" height="92" rx="6"/>
      <ellipse class="chair" cx="98" cy="142" rx="30" ry="36"/>
    </g>
  </g>

  <!-- Sitting Area 1 -->
  <g id="room-sitting-1" data-room="sitting-area-1">
    <rect class="room" x="45" y="344" width="625" height="234" rx="14" fill="#EEF5FF"/>
    <rect class="pill" x="275" y="355" width="170" height="34" rx="17"/>
    <text x="360" y="378" text-anchor="middle" class="pill-text" font-size="16">Sitting Area 1</text>
    <g transform="translate(64 399)">
      <rect class="desk" width="200" height="82" rx="8"/>
      <rect class="furniture" x="0" y="82" width="60" height="86" rx="5"/>
      <ellipse class="chair" cx="130" cy="139" rx="30" ry="36"/>
    </g>
    <g transform="translate(271 399)">
      <rect class="desk" width="174" height="82" rx="8"/>
      <ellipse class="chair" cx="87" cy="139" rx="30" ry="36"/>
    </g>
  </g>

  <!-- SOC / Gemma -->
  <g id="room-soc" data-room="soc">
    <rect class="room" x="770" y="332" width="342" height="272" rx="14" fill="#F0EEFF"/>
    <rect class="pill" x="885" y="350" width="112" height="34" rx="17"/>
    <text x="941" y="373" text-anchor="middle" class="pill-text" font-size="18">SOC</text>
    <path d="M770 454H1112" stroke="#D8DEE5" stroke-width="2"/>
    <rect class="pill" x="870" y="469" width="142" height="34" rx="17"/>
    <text x="941" y="492" text-anchor="middle" class="pill-text" font-size="18">GEMMA</text>
  </g>

  <!-- Reception -->
  <g id="room-reception" data-room="reception">
    <rect class="room" x="1175" y="338" width="153" height="143" rx="14" fill="#FFF0F1"/>
    <rect class="pill" x="1189" y="348" width="124" height="34" rx="17"/>
    <text x="1251" y="371" text-anchor="middle" class="pill-text" font-size="16">Reception</text>
    <rect class="desk" x="1205" y="375" width="96" height="43" rx="7" transform="rotate(-28 1253 396)"/>
    <ellipse class="chair" cx="1210" cy="364" rx="19" ry="25" transform="rotate(-25 1210 364)"/>
  </g>

  <!-- Sitting 3 -->
  <g id="room-sitting-3" data-room="sitting-area-3">
    <rect class="room" x="1365" y="340" width="160" height="255" rx="14" fill="#EAF6F2"/>
    <rect class="pill" x="1378" y="349" width="134" height="34" rx="17"/>
    <text x="1445" y="372" text-anchor="middle" class="pill-text" font-size="15">Sitting Area 3</text>
    <rect class="desk" x="1382" y="415" width="123" height="51" rx="7"/>
    <rect class="furniture" x="1469" y="466" width="36" height="64" rx="5"/>
    <ellipse class="chair" cx="1444" cy="505" rx="24" ry="30"/>
  </g>

  <!-- Rest rooms -->
  <g id="room-restrooms" data-room="rest-rooms">
    <rect class="room" x="1583" y="321" width="122" height="328" rx="14" fill="#F4F6F8"/>
    <rect class="pill" x="1592" y="344" width="104" height="34" rx="17"/>
    <text x="1644" y="367" text-anchor="middle" class="pill-text" font-size="15">Rest Rooms</text>
    <path d="M1583 486H1705" stroke="#D8DEE5" stroke-width="2"/>
    <text x="1644" y="530" text-anchor="middle" class="small" font-size="14">WC</text>
  </g>

  <!-- Lower rooms -->
  <g id="room-chatgpt" data-room="chat-gpt">
    <rect class="room" x="45" y="675" width="625" height="136" rx="14" fill="#F4F1FF"/>
    <rect class="pill" x="285" y="686" width="145" height="34" rx="17"/>
    <text x="357" y="709" text-anchor="middle" class="pill-text" font-size="17">Chat GPT</text>
  </g>

  <g id="room-safari" data-room="safari">
    <rect class="room" x="788" y="675" width="405" height="136" rx="14" fill="#EEF5FF"/>
    <rect class="pill" x="930" y="686" width="120" height="34" rx="17"/>
    <text x="990" y="709" text-anchor="middle" class="pill-text" font-size="17">Safari</text>
  </g>

  <g id="room-falcon" data-room="falcon">
    <rect class="room" x="1193" y="675" width="227" height="136" rx="14" fill="#FFF5E8"/>
    <rect class="pill" x="1248" y="686" width="118" height="34" rx="17"/>
    <text x="1307" y="709" text-anchor="middle" class="pill-text" font-size="17">Falcon</text>
    <rect class="desk" x="1270" y="733" width="76" height="62" rx="6"/>
    <g class="chair">
      <rect x="1248" y="744" width="14" height="34" rx="5"/>
      <rect x="1348" y="744" width="14" height="34" rx="5"/>
      <rect x="1248" y="782" width="14" height="25" rx="5"/>
      <rect x="1348" y="782" width="14" height="25" rx="5"/>
    </g>
  </g>

  <!-- Corridor / circulation overlay -->
  <g id="circulation">
    <path d="M45 255 H1705" fill="none" stroke="#FFFFFF" stroke-width="72"/>
    <path d="M45 255 H1705" fill="none" stroke="#DDE3E9" stroke-width="2" stroke-dasharray="5 12"/>
    <path d="M704 255 V895" fill="none" stroke="#FFFFFF" stroke-width="72"/>
    <path d="M704 255 V895" fill="none" stroke="#DDE3E9" stroke-width="2" stroke-dasharray="5 12"/>
  </g>

  <!-- Outer / major wall geometry -->
  <g id="walls" fill="none" stroke="#27313B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 31H1705V321H1705V649H1705V811H1420"/>
    <path d="M45 31V233H450"/>
    <path d="M527 31V233H1705"/>
    <path d="M45 344H670V578H45Z"/>
    <path d="M770 332H1112V604H770"/>
    <path d="M1175 338H1328V481H1175Z"/>
    <path d="M1365 340H1525V595H1365"/>
    <path d="M1583 321H1705V649H1583"/>
    <path d="M45 675H670V811H45Z"/>
    <path d="M788 675H1193V811H788Z"/>
    <path d="M1193 675H1420V811H1193Z"/>
    <path d="M45 811H1705"/>
    <path d="M45 31V811"/>
  </g>

  <!-- Door openings -->
  <g id="doors" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <path d="M450 31V95"/>
    <path d="M527 31V95"/>
    <path d="M670 344V410"/>
    <path d="M770 332V392"/>
    <path d="M1112 332V392"/>
    <path d="M1175 338V395"/>
    <path d="M1328 338V395"/>
    <path d="M1365 340V398"/>
    <path d="M1525 340V398"/>
    <path d="M1583 480V540"/>
    <path d="M670 675V735"/>
    <path d="M788 675V735"/>
    <path d="M1193 675V735"/>
    <path d="M1420 675V735"/>
  </g>

  <!-- Beacon coordinates are maintained by Flutter/backend and are intentionally not rendered. -->

  <!-- Sample route layer; keep this group and toggle visibility from the app -->
  <g id="navigation-route" data-layer="route" visibility="hidden">
    <path class="route" d="M485 255 C610 255 660 255 735 255 C900 255 1010 255 1128 255 C1250 255 1400 255 1550 255
                         C1550 300 1550 380 1525 430 C1490 500 1440 560 1400 620
                         C1260 620 1000 620 735 620"/>
    <circle cx="485" cy="255" r="13" fill="#FFFFFF" stroke="#2F80ED" stroke-width="6"/>
    <circle cx="735" cy="620" r="13" fill="#2F80ED"/>
  </g>

  <!-- Current-user marker -->
  <g id="user-location" data-layer="user-location" visibility="hidden">
    <circle cx="485" cy="255" r="30" fill="#2F80ED" opacity=".18"/>
    <circle cx="485" cy="255" r="13" fill="#2F80ED" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M485 213L495 235H475Z" fill="#2F80ED"/>
  </g>

</svg>
